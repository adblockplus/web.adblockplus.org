<!-- ===== 9. TESTIMONIALS =====
  Real Chrome Web Store reviews, quoted verbatim with the reviewer names and
  dates as they appear publicly. Do not edit the quotes to read better — if a
  quote needs shortening, use an ellipsis and keep the meaning intact.

  Initial avatars rather than the reviewers' profile pictures, so we are not
  republishing someone's photo.
-->
<section class="video-trial-section video-trial-section--testimonials" data-reveal>
  <div class="video-trial-container">
    <h2 class="video-trial-section__heading">
      {{ video-trial-testimonials__heading Loved by millions }}<br>
      <span class="video-trial-section__heading-muted">{{ video-trial-testimonials__heading-2 of users worldwide }}</span>
    </h2>

    <div class="video-trial-quotes">

      <figure class="video-trial-quote">
        <p class="video-trial-quote__stars">
          <span aria-hidden="true">★★★★★</span>
          <span class="sr-only">{{ video-trial-testimonials__rating 5 out of 5 stars }}</span>
        </p>
        <blockquote class="video-trial-quote__text">
          {{ video-trial-testimonials__quote-1 “I’ve tried several ad blockers over the years, but I always end up coming back to Adblock Plus. It’s by far the best free option for me. It has saved me from YouTube’s annoying ads, and the browsing experience is so much better. Highly recommended!” }}
        </blockquote>
        <figcaption class="video-trial-quote__author">
          <span class="video-trial-quote__avatar video-trial-quote__avatar--red" aria-hidden="true">S</span>
          <span>
            <span class="video-trial-quote__name">Sayed</span>
            <span class="video-trial-quote__source">
              {{ video-trial-testimonials__source-1 Chrome Web Store · Jul 2026 }}
            </span>
          </span>
        </figcaption>
      </figure>

      <figure class="video-trial-quote">
        <p class="video-trial-quote__stars">
          <span aria-hidden="true">★★★★★</span>
          <span class="sr-only">{{ video-trial-testimonials__rating }}</span>
        </p>
        <blockquote class="video-trial-quote__text">
          {{ video-trial-testimonials__quote-2 “I’ve been using it for years and I love it. The free version is good, but the Premium level is well worth the annual fee. Adblock Plus is one of the very few things that I recommend to other people.” }}
        </blockquote>
        <figcaption class="video-trial-quote__author">
          <span class="video-trial-quote__avatar video-trial-quote__avatar--blue" aria-hidden="true">R</span>
          <span>
            <span class="video-trial-quote__name">Robert</span>
            <span class="video-trial-quote__source">
              {{ video-trial-testimonials__source-2 Chrome Web Store · Jun 2026 }}
            </span>
          </span>
        </figcaption>
      </figure>

      <figure class="video-trial-quote">
        <p class="video-trial-quote__stars">
          <span aria-hidden="true">★★★★★</span>
          <span class="sr-only">{{ video-trial-testimonials__rating }}</span>
        </p>
        <blockquote class="video-trial-quote__text">
          {{ video-trial-testimonials__quote-3 “Blocked ads on all websites including youtube. It had problems with youtube but now they’ve fixed it.” }}
        </blockquote>
        <figcaption class="video-trial-quote__author">
          <span class="video-trial-quote__avatar video-trial-quote__avatar--green" aria-hidden="true">M</span>
          <span>
            <span class="video-trial-quote__name">M shuja</span>
            <span class="video-trial-quote__source">
              {{ video-trial-testimonials__source-3 Chrome Web Store · Jun 2026 }}
            </span>
          </span>
        </figcaption>
      </figure>

    </div>
  </div>
</section>
