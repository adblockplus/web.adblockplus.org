<!-- ===== 1. BRAND BAR ===== -->
<header class="whats-new-header">
  <div class="whats-new-header__brand">
    <img
      alt=""
      class="whats-new-header__logo"
      height="30"
      width="30"
      src="/update/abp-logo.svg">
    <span class="whats-new-header__name">Adblock Plus</span>
  </div>

  <!-- Black Friday (LOVEAB-49). Hidden on trial URLs, which keep the trial offer.
       Starts the yearly checkout, like the pricing card's CTA. -->
  <button type="button" class="whats-new-bf" data-wn-offer="standard" data-frequency="yearly" data-trigger="banner" disabled>
    <span class="whats-new-bf__label">{{ whats-new-bf__label Black Friday }}</span>
    <strong class="whats-new-bf__headline">{{ whats-new-bf__headline 30% off your first year of Premium }}</strong>
    <span class="whats-new-bf__ends">{{ whats-new-bf__ends Ends Mon, 30 Nov }}</span>
  </button>

  <!--
    Server-rendered with the same v1.0.0 fallback AdBlock's page uses, so the
    pill never flashes empty and survives a JS failure. whats-new-stats.js
    replaces it with the real extension version as soon as the payload lands.
  -->
  <p class="whats-new-header__version">
    <span class="whats-new-header__version-number">v1.0.0</span>
  </p>
</header>
