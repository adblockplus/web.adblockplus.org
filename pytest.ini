[pytest]
# Python tests: the vendored CMS generator suite + repo build-script tests.
testpaths = cms/tests scripts/tests
markers =
    slowtest: spins up a live dev server (deselect with -m "not slowtest")
filterwarnings =
    # Benign: tests re-run cms.bin.generate_static_pages as __main__ via runpy
    # after it has already been imported.
    ignore:.*found in sys.modules after import of package.*:RuntimeWarning
