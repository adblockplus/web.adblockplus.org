server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Approximate Firebase's cleanUrls so extensionless links (e.g. /en/about)
  # resolve to the generated .html files. This is the only firebase.json
  # behaviour reproduced here — see the Dockerfile header for what is not.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
